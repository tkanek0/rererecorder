# The recorder on Linux: `make up`. See docs/decisions.md 30.
#
#   docker compose run --rm api python scripts/record.py --seconds 30

name: rererecorder

services:
  api:
    build:
      context: .
    image: rererecorder:latest
    # Bind-mounted rather than passed as devices, so a device plugged in
    # later is reachable too; USB (189) and ALSA (116) may be opened.
    # See docs/decisions.md 13.
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 116:* rmw"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/snd:/dev/snd
      # A link on the host, resolved there: docs/decisions.md 28.
      - ${RRR_DATA:-./data}:/data
      - .:/app
    # Recordings go to the mounted data root; every other setting in
    # docs/features.md "Configuration" is passed through when it is set.
    environment:
      RRR_SESSIONS_DIR: /data/sessions
      RRR_API_PORT: ${RRR_API_PORT:-8040}
      RRR_DEPTH:
      RRR_COLOR:
      RRR_COLOR_FORMAT:
      RRR_INFRARED:
      RRR_MOTION:
      RRR_ALIGN:
      RRR_EMITTER:
      RRR_DEPTH_CODEC:
      RRR_COLOR_CODEC:
      RRR_INFRARED_CODEC:
      RRR_SERIAL:
      RRR_VIDEO:
      RRR_AUDIO:
      RRR_DOA:
      RRR_AUDIO_DEVICE:
      RRR_AUDIO_BLOCK_SIZE:
      RRR_AUDIO_WINDOW_S:
      RRR_AUDIO_DOA_POLL_HZ:
      RRR_IDLE_SHUTDOWN_S:
      RRR_PREVIEW_WIDTH:
      RRR_JPEG_QUALITY:
      RRR_PREVIEW_MAX_HZ_IDLE:
      RRR_PREVIEW_MAX_HZ_RECORDING:
      RRR_AUDIO_LEVEL_HZ:
      RRR_AUDIO_LEVEL_WINDOW_S:
      RRR_ALLOW_ORIGINS:
      RRR_ALLOW_SETTINGS_WRITE:
      RRR_SHUTDOWN_TIMEOUT_S:
    ports:
      - "${RRR_HOST:-0.0.0.0}:${RRR_API_PORT:-8040}:${RRR_API_PORT:-8040}"
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${AUDIO_GID:-29}"
    cpus: ${RRR_CPUS:-8}

  app:
    # The host's node major, so frontend/node_modules serves both.
    image: node:24-slim
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    environment:
      VITE_CONTROL_PORT: ${RRR_API_PORT:-8040}
      # npm needs a writable HOME, and the invoking user has none here.
      HOME: /tmp
    command:
      - sh
      - -c
      - npm install --no-audit --no-fund && exec npm run dev -- --port ${RRR_APP_PORT:-5177}
    ports:
      - "${RRR_HOST:-0.0.0.0}:${RRR_APP_PORT:-5177}:${RRR_APP_PORT:-5177}"
    user: "${UID:-1000}:${GID:-1000}"

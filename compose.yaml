# The recorder on Linux: `make up`. See docs/decisions.md 30.
#
#   docker compose run --rm api python -m rrr.tools.record --seconds 30

name: rererecorder

services:
  api:
    build:
      context: .
    image: rererecorder:latest
    # The whole bus, and the user and group below: docs/decisions.md 13.
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/snd:/dev/snd
    volumes:
      # A link on the host, resolved there: docs/decisions.md 28.
      - ${RRR_DATA:-./data}:/data
      - .:/app
    environment:
      RRR_DEPTH: ${RRR_DEPTH:-1280x720@30}
      RRR_COLOR: ${RRR_COLOR:-1280x800@30}
      RRR_SESSIONS_DIR: ${RRR_SESSIONS_DIR:-/data/sessions}
      RRR_AUDIO: ${RRR_AUDIO:-1}
      RRR_API_PORT: ${RRR_API_PORT:-8040}
    ports:
      - "${RRR_HOST:-0.0.0.0}:${RRR_API_PORT:-8040}:${RRR_API_PORT:-8040}"
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${AUDIO_GID:-29}"
    cpus: ${RRR_CPUS:-8}

  app:
    # The host's node major, so web/node_modules serves both.
    image: node:24-slim
    working_dir: /web
    volumes:
      - ./web:/web
    environment:
      VITE_CONTROL_PORT: ${RRR_API_PORT:-8040}
      # npm needs a writable HOME, and the invoking user has none here.
      HOME: /tmp
    command:
      - sh
      - -c
      - npm install --no-audit --no-fund && exec npm run dev -- --port ${RRR_APP_PORT:-5177}
    ports:
      - "${RRR_HOST:-0.0.0.0}:${RRR_APP_PORT:-5177}:${RRR_APP_PORT:-5177}"
    user: "${UID:-1000}:${GID:-1000}"

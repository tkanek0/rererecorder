# Recording from inside the container.
#
#   docker compose -f docker/compose.yaml build
#   docker compose -f docker/compose.yaml run --rm recorder
#
# The camera reaches the container through /dev/bus/usb, which is all the RSUSB
# backend needs - no /dev/video*, no kernel module, nothing privileged. That is
# also why this image will run unchanged on a Raspberry Pi.

services:
  recorder:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rererecorder:latest
    # The whole USB bus, not one node: the camera's device number changes
    # every time it is re-enumerated, and a reset re-enumerates it.
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      # Where recordings go. 54 MB/s with every stream on, so this wants a disk
      # with room - 195 GB an hour.
      - ${RRR_DATA:-/mnt/dataspace02/rererecorder}:/data
      # Bind the source during development so a code change does not need a
      # rebuild. The image already contains a copy; this shadows it.
      - ..:/app
    environment:
      # The camera's maxima. Both streams are the sensors' native sizes, and
      # measured through this image they lose no frames at 30 fps.
      RRR_DEPTH: ${RRR_DEPTH:-1280x720@30}
      RRR_COLOR: ${RRR_COLOR:-1280x800@30}
      RRR_SESSIONS_DIR: ${RRR_SESSIONS_DIR:-/data/sessions}
      # Off until the array is wired into the container: recording it needs
      # /dev/snd passed through, and ALSA inside a container is unverified
      # here. With it on and the device absent, every session reports an audio
      # failure it cannot do anything about.
      RRR_AUDIO: ${RRR_AUDIO:-0}
    # Run as the invoking user, so recordings under var/ do not come out owned
    # by root. The camera stays reachable because the RealSense udev rule makes
    # its node world-writable (crw-rw-rw- root plugdev), so no group membership
    # is needed inside the container.
    #
    # UID and GID are not exported by most shells; pass them explicitly when
    # they are not 1000:
    #     UID=$(id -u) GID=$(id -g) docker compose -f docker/compose.yaml run --rm recorder
    user: "${UID:-1000}:${GID:-1000}"
    # Recording is I/O and encoder threads; give it room but not the machine.
    cpus: ${RRR_CPUS:-8}

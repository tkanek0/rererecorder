[project]
name = "rererecorder"
version = "0.1.0"
description = "Synchronised recording from a RealSense D455 and a ReSpeaker USB Mic Array"
requires-python = "==3.12.*"
dependencies = [
    "pyrealsense2==2.58.3.*",  # see docs/decisions.md 1
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "sounddevice>=0.5.1",
    "pyusb>=1.3.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "av>=18.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

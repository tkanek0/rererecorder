[project]
name = "rererecorder"
version = "0.1.0"
description = "Synchronised recording from a RealSense D455 and a ReSpeaker USB Mic Array"
requires-python = "==3.12.*"
dependencies = [
    "pyrealsense2==2.58.3.*",  # see docs/decisions.md 1
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "sounddevice>=0.5.1",
    "pyusb>=1.3.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "av>=18.1.0",
]

[project.scripts]
rrr-api = "rrr.api.server:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13"]
build-backend = "uv_build"

# The source root is named after its role, next to frontend/ - docs/decisions.md 27.
[tool.uv.build-backend]
module-root = "backend"
module-name = ["rrr", "respeaker_adapter", "realsense_adapter"]

[tool.ruff.lint]
# Fixed here, so a ruff upgrade cannot change what is checked.
select = [
    "F", # Pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
]
ignore = [
    "E402", # Module level import not at top of file
    "E501", # Line too long
    "E741", # Ambiguous variable name
]
unfixable = [
    "F401", # Unused import
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Scripts are not part of the package; their tests import them by file name.
# See docs/decisions.md 31.
pythonpath = ["scripts"]
addopts = "-q --strict-markers"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]
